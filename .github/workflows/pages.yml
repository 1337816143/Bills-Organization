name: Deploy Bills Organization to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check core.js
          node --check importers.js
          node --check migration.js
          node --check exports.js
          node --check enhancements.js
          node --check category-engine.js
          node --check project-intelligence.js
          node --check mobile-review.js
          node --check immersive-review.js
          node --check compat-fix.js
          node --check swipe-card-complete.js
          node --check swipe-v103.js
          node --check replace-import.js
          node --check app.js
          node --check app-shell.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
